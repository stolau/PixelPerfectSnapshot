name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pw-npm
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-npm-${{ steps.pw-npm.outputs.version }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: npm pack sanity check
        run: |
          npm pack -w packages/client
          tar -tzf pixelperfectsnapshot-*.tgz > pack-files.txt
          for f in dist/index.js dist/index.d.ts dist/global.d.ts dist/capture.js dist/rehydrate.js; do
            grep -qx "package/$f" pack-files.txt || { echo "tarball missing $f"; exit 1; }
          done

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - id: pw-pip
        run: |
          echo "version=$(pip show playwright | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-pip-${{ steps.pw-pip.outputs.version }}
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pw-npm
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './backend[dev]'
      - id: pw-pip
        run: |
          echo "version=$(pip show playwright | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-npm-${{ steps.pw-npm.outputs.version }}-pip-${{ steps.pw-pip.outputs.version }}
      - run: playwright install --with-deps chromium
      - run: npm run test:e2e -w examples/demo-app

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for backend health via nginx proxy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "backend healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "backend did not become healthy in time"
          docker compose logs
          exit 1
      - name: Smoke test POST /api/runs through nginx proxy
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/runs)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$code" != "201" ]; then
            echo "expected 201, got $code"
            docker compose logs
            exit 1
          fi
          if ! echo "$body" | grep -q '"id"'; then
            echo "missing id field"
            docker compose logs
            exit 1
          fi
          if ! echo "$body" | grep -q '"createdAt"'; then
            echo "missing createdAt field"
            docker compose logs
            exit 1
          fi
      - name: Upload >1MB snapshot through nginx proxy (guards client_max_body_size regression)
        run: |
          run_response=$(curl -s -X POST http://localhost:8080/api/runs)
          run_id=$(echo "$run_response" | sed -n 's/.*"id": *"\([^"]*\)".*/\1/p')
          if [ -z "$run_id" ]; then
            echo "could not extract run id from: $run_response"
            exit 1
          fi
          padding=$(head -c 1500000 /dev/zero | tr '\0' 'x')
          printf '{"formatVersion":0,"name":"large-page","viewport":{"width":1280,"height":720},"html":"<html><body><!--%s--></body></html>","stylesheets":[]}' "$padding" > /tmp/large-snapshot.json
          response=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:8080/api/runs/$run_id/snapshots" -H "Content-Type: application/json" --data-binary @/tmp/large-snapshot.json)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | head -c 300
          if [ "$code" = "413" ]; then
            echo "regression: nginx rejected an upload under PPS_MAX_UPLOAD_BYTES with 413"
            docker compose logs
            exit 1
          fi
          if [ "$code" != "201" ]; then
            echo "expected 201, got $code"
            docker compose logs
            exit 1
          fi
      - name: Smoke test POST /api/runs/<id>/process through nginx proxy (non-root appuser + Playwright render)
        run: |
          run_response=$(curl -s -X POST http://localhost:8080/api/runs)
          run_id=$(echo "$run_response" | sed -n 's/.*"id": *"\([^"]*\)".*/\1/p')
          if [ -z "$run_id" ]; then
            echo "could not extract run id from: $run_response"
            docker compose logs
            exit 1
          fi
          printf '{"formatVersion":0,"name":"process-smoke-page","viewport":{"width":1280,"height":720},"html":"<html><body>process smoke</body></html>","stylesheets":[]}' > /tmp/process-smoke-snapshot.json
          response=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:8080/api/runs/$run_id/snapshots" -H "Content-Type: application/json" --data-binary @/tmp/process-smoke-snapshot.json)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$code" != "201" ]; then
            echo "expected 201, got $code: $body"
            docker compose logs
            exit 1
          fi
          response=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:8080/api/runs/$run_id/process")
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$code" != "200" ]; then
            echo "expected 200, got $code: $body"
            docker compose logs
            exit 1
          fi
          if ! echo "$body" | grep -qE '"name": *"process-smoke-page".*"status": *"(pass|approved-baseline-missing)"'; then
            echo "expected process-smoke-page status to be pass or approved-baseline-missing, got: $body"
            docker compose logs
            exit 1
          fi
      - name: Upload >25MB payload through nginx proxy (proves nginx has no independent cap; backend's JSON 413 must fire, not nginx's HTML 413)
        run: |
          run_response=$(curl -s -X POST http://localhost:8080/api/runs)
          run_id=$(echo "$run_response" | sed -n 's/.*"id": *"\([^"]*\)".*/\1/p')
          if [ -z "$run_id" ]; then
            echo "could not extract run id from: $run_response"
            exit 1
          fi
          head -c 100000000 /dev/zero | tr '\0' 'x' > /tmp/huge-padding.txt
          printf '{"formatVersion":0,"name":"huge-page","viewport":{"width":1280,"height":720},"html":"<html><body><!--' > /tmp/huge-snapshot.json
          cat /tmp/huge-padding.txt >> /tmp/huge-snapshot.json
          printf -- '--></body></html>","stylesheets":[]}' >> /tmp/huge-snapshot.json
          response=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:8080/api/runs/$run_id/snapshots" -H "Content-Type: application/json" --data-binary @/tmp/huge-snapshot.json)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | head -c 300
          if [ "$code" != "413" ]; then
            echo "expected 413 (backend's own cap), got $code -- nginx may be imposing an independent limit, or the request unexpectedly succeeded"
            docker compose logs
            exit 1
          fi
          if echo "$body" | grep -qi '<html'; then
            echo "regression: got nginx's raw HTML 413 page instead of the backend's JSON error"
            docker compose logs
            exit 1
          fi
          if ! echo "$body" | grep -q '"error"'; then
            echo "missing JSON error field in 413 response body"
            docker compose logs
            exit 1
          fi
      - name: docker compose down
        if: always()
        run: docker compose down -v
