[project]
name = "pixelperfectsnapshot-backend"
version = "0.0.1"
description = "PixelPerfectSnapshot backend: snapshot ingest, re-render, pixel diff, baselines"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
