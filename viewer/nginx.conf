server {
    listen 80;

    location /api/ {
        # No independent cap here: PPS_MAX_UPLOAD_BYTES (backend/app/__init__.py) is the single
        # configured limit. Setting this to 0 means any operator override of that env var is
        # honored automatically with no nginx wiring, and oversized requests still get the
        # backend's JSON 413 (not nginx's raw HTML error page) regardless of the configured value.
        client_max_body_size 0;
        proxy_pass http://backend:5000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
