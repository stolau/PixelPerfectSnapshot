server {
    listen 80;

    location /api/ {
        # Keep in sync with PPS_MAX_UPLOAD_BYTES default in backend/app/__init__.py
        client_max_body_size 25m;
        proxy_pass http://backend:5000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
